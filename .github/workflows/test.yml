name: Zig Linux comparison
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Comparison or focused Linux validation
        type: choice
        options: [comparison, validation, scaling, crypto]
        default: comparison
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30 --shm-size=5g
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGROOT: /opt/conduit-zig-tools/postgresql-18.6
      CHALLENGE_WORK: /tmp/zig-reactor-v2
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/go.mod, cache-dependency-path: bench/go.sum }
      - name: Tools and host identity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client curl jq sysstat
          mkdir -p "$CHALLENGE_WORK/tools" "$CHALLENGE_WORK/results"
          { uname -a; nproc; lscpu; free -m; df -h .; } > "$CHALLENGE_WORK/results/host.txt"
          echo '/opt/conduit-zig-tools/zig-0.17.0' >> "$GITHUB_PATH"
          sudo bash submissions/zig-reactor-Chemske/install.sh
      - name: Fixed benchmark PostgreSQL settings on disposable CI service
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # The eight-CPU/16-GiB box's published settings. Never used by install/start.
          docker exec -i "$DB_CONTAINER" sh -c 'cat >> "$PGDATA/postgresql.conf"' <<'CONF'
          max_connections = 100
          shared_buffers = 4GB
          effective_cache_size = 12GB
          maintenance_work_mem = 1GB
          checkpoint_completion_target = 0.9
          wal_buffers = 16MB
          default_statistics_target = 100
          random_page_cost = 1.1
          effective_io_concurrency = 200
          work_mem = 9709kB
          huge_pages = try
          min_wal_size = 1GB
          max_wal_size = 4GB
          max_worker_processes = 8
          max_parallel_workers = 8
          max_parallel_workers_per_gather = 4
          max_parallel_maintenance_workers = 4
          CONF
          docker restart "$DB_CONTAINER"
          for attempt in $(seq 60); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 1; done
      - name: Full unchanged seed and load generator
        if: inputs.mode != 'crypto'
        run: |
          if [ "${{ inputs.mode }}" != validation ]; then bash seed/make-seed.sh; fi
          bash seed/make-seed.sh --dev
          (cd examples/go && go build -trimpath -o "$CHALLENGE_WORK/tools/reference-go" .)
          (cd bench && go build -o "$CHALLENGE_WORK/tools/loadgen" ./cmd/loadgen && go build -o "$CHALLENGE_WORK/tools/conformance" ./cmd/conformance)
      - name: Build baseline and candidates
        if: inputs.mode == 'comparison'
        run: |
          set -e
          baseline="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline"
          git archive a026224 submissions/zig-reactor-Chemske | tar -x -C "$baseline"
          (cd "$baseline/submissions/zig-reactor-Chemske" && zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" --prefix "$CHALLENGE_WORK/build-A")
          cd submissions/zig-reactor-Chemske
          zig build test -Dpg-root="$PGROOT" -Dreactors=2 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 --summary all
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=1 -Ddb-connections=4 --prefix "$CHALLENGE_WORK/build-B"
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=2 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=32 -Dmax-tasks=8192 --prefix "$CHALLENGE_WORK/build-C"
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=2 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 -Dmax-tasks=8192 --prefix "$CHALLENGE_WORK/build-D"
      - name: Repeated Linux comparison and unchanged conformance
        if: inputs.mode == 'comparison'
        run: |
          sudo prlimit --pid $$ --nofile=200000:200000
          ulimit -n 200000
          cd submissions/zig-reactor-Chemske
          python3 benchmarks/linux_compare.py --variant "A=$CHALLENGE_WORK/build-A/bin/conduit" --variant "B=$CHALLENGE_WORK/build-B/bin/conduit" --variant "C=$CHALLENGE_WORK/build-C/bin/conduit" --variant "D=$CHALLENGE_WORK/build-D/bin/conduit" --order ABCDDCBA --users 20000 --ramp 15s --measure 30s --tail 3s --conformance --out "$CHALLENGE_WORK/results/comparison"
      - name: Higher offered load and Linux reactor checks
        if: inputs.mode == 'comparison'
        run: |
          sudo prlimit --pid $$ --nofile=200000:200000
          ulimit -n 200000
          cd submissions/zig-reactor-Chemske
          python3 benchmarks/linux_compare.py --variant "C=$CHALLENGE_WORK/build-C/bin/conduit" --variant "D=$CHALLENGE_WORK/build-D/bin/conduit" --order CDDC --users 40000 --ramp 15s --measure 30s --tail 3s --out "$CHALLENGE_WORK/results/higher-load"
          mkdir -p zig-out/bin
          cp "$CHALLENGE_WORK/build-D/bin/conduit" zig-out/bin/conduit
          python3 tests/write_pool.py --writers 4
          python3 tests/linux_connections.py
          python3 tests/reactor.py --reactors 2
          python3 tests/milestone5.py
          python3 tests/recovery.py --connections 16
          cp "$CHALLENGE_WORK/build-B/bin/conduit" zig-out/bin/conduit
          python3 tests/page_batch.py
          python3 tests/comment_batch.py
      - name: Focused Linux ownership and failure checks
        if: inputs.mode == 'validation'
        run: |
          sudo prlimit --pid $$ --nofile=200000:200000
          ulimit -n 200000
          cd submissions/zig-reactor-Chemske
          zig build test -Dpg-root="$PGROOT" -Dreactors=2 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 -Dbcrypt-lanes=4 -Dbcrypt-gather-ms=75 --summary all
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=1 -Ddb-connections=4 -Dread-batch-size=128
          python3 tests/page_batch.py
          python3 tests/comment_batch.py
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=2 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 -Dmax-tasks=8192 -Dbcrypt-lanes=4 -Dbcrypt-gather-ms=75
          python3 tests/password_batch.py
          python3 tests/write_pool.py --writers 4
          python3 tests/reactor.py --reactors 2
          python3 tests/linux_connections.py
          python3 tests/milestone5.py
          python3 tests/recovery.py --connections 16
      - name: Compare two and four reactors under higher offered load
        if: inputs.mode == 'scaling'
        run: |
          sudo prlimit --pid $$ --nofile=200000:200000
          ulimit -n 200000
          cd submissions/zig-reactor-Chemske
          zig build test -Dpg-root="$PGROOT" -Dreactors=4 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 --summary all
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=2 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 -Dmax-tasks=8192 --prefix "$CHALLENGE_WORK/build-C"
          zig build -Doptimize=ReleaseFast -Dpg-root="$PGROOT" -Dreactors=4 -Ddb-connections=16 -Dwrite-connections=4 -Dread-batch-size=128 -Dmax-tasks=8192 --prefix "$CHALLENGE_WORK/build-D"
          python3 benchmarks/linux_compare.py --variant "C=$CHALLENGE_WORK/build-C/bin/conduit" --variant "D=$CHALLENGE_WORK/build-D/bin/conduit" --order CDDC --users 60000 --ramp 15s --measure 30s --tail 3s --conformance --out "$CHALLENGE_WORK/results/reactor-scaling"
          mkdir -p zig-out/bin
          cp "$CHALLENGE_WORK/build-D/bin/conduit" zig-out/bin/conduit
          python3 tests/write_pool.py --writers 4
          python3 tests/reactor.py --reactors 4
          python3 tests/linux_connections.py
          python3 tests/recovery.py --connections 16
      - name: Independent cost-ten bcrypt comparison
        if: inputs.mode == 'crypto'
        run: |
          set -euo pipefail
          cd submissions/zig-reactor-Chemske
          zig build test -Dpg-root="$PGROOT" --summary all
          zig build password-bench -Doptimize=ReleaseFast 2>&1 | tee "$CHALLENGE_WORK/results/passwords.jsonl"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-linux-comparison
          path: ${{ env.CHALLENGE_WORK }}/results
          retention-days: 14
